  display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{width:100%;max-width:440px}
.event{color:#fff;margin:0 0 18px}
.event h1{margin:0;font-size:clamp(26px,4.4vw,36px);line-height:1.08;font-weight:700;letter-spacing:-.01em}
.event p{margin:10px 0 0;font-size:16px;color:rgba(255,255,255,.88)}
.event .rule{display:block;width:120px;height:2px;background:var(--red);margin:14px 0 0}
.panel{background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(5,20,40,.35);overflow:hidden}
.panel-in{padding:24px 26px 22px}
.btc{display:block;height:64px;width:auto;margin:0 0 14px}
.lede{margin:0 0 18px;color:var(--ink-2);font-size:15.5px;line-height:1.45}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field{display:flex;border:1px solid var(--line-2);border-radius:6px;background:#fff;overflow:hidden}
.field:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.field input{flex:1;min-width:0;border:0;background:none;color:var(--navy);font:inherit;font-size:17px;padding:11px 12px;letter-spacing:.02em}
.field input:focus{outline:none}
.show{appearance:none;border:0;border-left:1px solid var(--line);background:none;color:var(--ink-2);font:inherit;font-size:13.5px;font-weight:600;padding:0 12px;cursor:pointer}
.err{margin:8px 0 0;color:var(--red);font-size:14px;min-height:20px}
.remember{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);margin:6px 0 18px;cursor:pointer}
.remember input{accent-color:var(--red);width:16px;height:16px}
.go{appearance:none;border:0;width:100%;background:var(--navy);color:#fff;font:inherit;font-weight:600;font-size:16px;padding:12px 16px;border-radius:6px;cursor:pointer}
.go:hover{background:#1F5F93}
.go[disabled]{opacity:.7;cursor:progress}
.co{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 22px;border-top:1px solid var(--line);background:#fff}
.co span{font-size:12px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.co img{width:auto;display:block}
.co img[alt="Blue Tech Club"]{height:38px}
.co img[alt="GICAN"]{height:22px}
.co img[alt="Blue Pelican Capital"]{height:34px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.foot{margin:14px 0 0;color:rgba(255,255,255,.75);font-size:12.5px;text-align:center}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion: reduce){.shake{animation:none}}
@media (max-width:420px){.co img[alt="Blue Tech Club"]{height:30px}.co img[alt="GICAN"]{height:17px}.co img[alt="Blue Pelican Capital"]{height:27px}.panel-in{padding:20px 18px}}
</style>

<script>
(function(){
"use strict";
const P = JSON.parse(document.getElementById("payload").textContent);
const KEY = "btc-acces", DAYS = 30;
const $ = id => document.getElementById(id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));

if (!window.crypto || !crypto.subtle){
  $("err").textContent = "Ce navigateur ne permet pas d’ouvrir le document. Ouvrez-le en https ou avec un navigateur récent.";
  $("go").disabled = true; return;
}

async function derive(code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64d(P.s), iterations: P.it, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
async function decrypt(key){
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64d(P.i)}, key, b64d(P.c));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
function store(raw, remember){
  const rec = JSON.stringify({k: raw, s: P.s, exp: Date.now() + DAYS * 864e5});
  try { sessionStorage.setItem(KEY, rec); if (remember) localStorage.setItem(KEY, rec); } catch(e) {}
}
async function tryStored(){
  for (const st of [sessionStorage, localStorage]){
    let rec; try { rec = JSON.parse(st.getItem(KEY) || "null"); } catch(e) { rec = null; }
    if (!rec) continue;
    if (rec.s !== P.s || rec.exp < Date.now()){ try { st.removeItem(KEY); } catch(e) {} continue; }
    try {
      const key = await crypto.subtle.importKey("raw", b64d(rec.k), {name: "AES-GCM"}, false, ["decrypt"]);
      show(await decrypt(key)); return true;
    } catch(e) { try { st.removeItem(KEY); } catch(_) {} }
  }
  return false;
}

$("show").addEventListener("click", () => {
  const c = $("code"), on = c.type === "password";
  c.type = on ? "text" : "password";
  $("show").textContent = on ? "Masquer" : "Afficher";
  $("show").setAttribute("aria-pressed", on);
  c.focus();
});
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const code = $("code").value.trim();
  if (!code) return;
  $("go").disabled = true; $("go").textContent = "Ouverture…"; $("err").textContent = "";
  try {
    const key = await derive(code);
    const raw = b64e(await crypto.subtle.exportKey("raw", key));
    const html = await decrypt(key);
    store(raw, $("remember").checked);
    show(html);
  } catch(err) {
    $("go").disabled = false; $("go").textContent = "Ouvrir le dashboard";
    $("err").textContent = "Code incorrect. Vérifiez les majuscules, les minuscules et les tirets.";
    const fld = $("field"); fld.classList.remove("shake"); void fld.offsetWidth; fld.classList.add("shake");
    $("code").select();
  }
});
tryStored();
})();
</script>
